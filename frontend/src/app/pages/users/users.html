<main class="px-7 py-5">
  <h1 class="text-3xl font-semibold">Workers</h1>

  <div class="overflow-x-auto bg-white rounded-lg mt-5">
    <table class="table w-full">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Role</th>
          <th>Country</th>
          <th>Numero</th>
          <th>Correo</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Nueva fila para registrar Worker -->
        <tr>
          <td></td>
          <td><input type="text" [(ngModel)]="newWorker.name" placeholder="Name" class="input input-sm w-full" /></td>
          <td><input type="text" [(ngModel)]="newWorker.role" placeholder="Role" class="input input-sm w-full" /></td>
          <td><input type="text" [(ngModel)]="newWorker.country" placeholder="Country" class="input input-sm w-full" /></td>
          <td><input type="number" [(ngModel)]="newWorker.numero" placeholder="Numero" class="input input-sm w-full" /></td>
          <td><input type="email" [(ngModel)]="newWorker.correo" placeholder="Correo" class="input input-sm w-full" /></td>
          <td>
            <button class="btn btn-primary btn-sm" (click)="createWorker()">Save</button>
          </td>
        </tr>

        <!-- Filas existentes -->
        <tr *ngFor="let worker of workers; let i = index">
          <td>
            <input type="checkbox" class="checkbox" />
          </td>

          <!-- Celdas editables -->
          <td>
            <input *ngIf="editingIndex === i" [(ngModel)]="worker.name" class="input input-sm w-full" />
            <span *ngIf="editingIndex !== i">{{ worker.name }}</span>
          </td>
          <td>
            <input *ngIf="editingIndex === i" [(ngModel)]="worker.role" class="input input-sm w-full" />
            <span *ngIf="editingIndex !== i">{{ worker.role }}</span>
          </td>
          <td>
            <input *ngIf="editingIndex === i" [(ngModel)]="worker.country" class="input input-sm w-full" />
            <span *ngIf="editingIndex !== i">{{ worker.country }}</span>
          </td>
          <td>
            <input *ngIf="editingIndex === i" type="number" [(ngModel)]="worker.numero" class="input input-sm w-full" />
            <span *ngIf="editingIndex !== i">{{ worker.numero }}</span>
          </td>
          <td>
            <input *ngIf="editingIndex === i" type="email" [(ngModel)]="worker.correo" class="input input-sm w-full" />
            <span *ngIf="editingIndex !== i">{{ worker.correo }}</span>
          </td>

          <td>
            <button *ngIf="editingIndex !== i" class="btn btn-ghost btn-sm" (click)="startEditing(i)">Edit</button>
            <button *ngIf="editingIndex === i" class="btn btn-success btn-sm" (click)="saveWorker(worker)">Save</button>
            <button *ngIf="editingIndex === i" class="btn btn-error btn-sm" (click)="cancelEditing()">Cancel</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
